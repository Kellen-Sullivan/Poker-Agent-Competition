[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-agent-competition"
version = "0.1.0"
description = "OSU AI Club Poker Competition 2026"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pettingzoo>=1.24.0",
    "rlcard>=1.0.0",
    "gymnasium>=0.28.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "torch>=2.0.0",
]

[tool.setuptools]
py-modules = ["poker_env", "agents", "agent", "test_agent"]
packages = ["rl_example"]
